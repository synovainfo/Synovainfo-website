<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <rect width="800" height="500" rx="24" fill="#080E18" stroke="#1E293B" stroke-width="2"/>
  <!-- Pipeline flow -->
  <g transform="translate(60, 200)">
    <rect width="140" height="100" rx="16" fill="#0F1B2D" stroke="#8B5CF6" stroke-width="2"/>
    <text x="70" y="45" text-anchor="middle" fill="#8B5CF6" font-family="sans-serif" font-size="12" font-weight="bold">1. Ingestion</text>
    <text x="70" y="70" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="10">Kafka Stream</text>
  </g>

  <path d="M200 250h60" stroke="#8B5CF6" stroke-width="3"/>

  <g transform="translate(260, 200)">
    <rect width="140" height="100" rx="16" fill="#0F1B2D" stroke="#EC4899" stroke-width="2"/>
    <text x="70" y="45" text-anchor="middle" fill="#EC4899" font-family="sans-serif" font-size="12" font-weight="bold">2. Vector Index</text>
    <text x="70" y="70" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="10">Pinecone RAG</text>
  </g>

  <path d="M400 250h60" stroke="#EC4899" stroke-width="3"/>

  <g transform="translate(460, 200)">
    <rect width="140" height="100" rx="16" fill="#0F1B2D" stroke="#06B6D4" stroke-width="2"/>
    <text x="70" y="45" text-anchor="middle" fill="#06B6D4" font-family="sans-serif" font-size="12" font-weight="bold">3. vLLM Engine</text>
    <text x="70" y="70" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="10">Sub-10ms GPU</text>
  </g>

  <path d="M600 250h60" stroke="#06B6D4" stroke-width="3"/>

  <g transform="translate(660, 200)">
    <rect width="100" height="100" rx="16" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2"/>
    <text x="50" y="55" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold">Agent</text>
  </g>

  <text x="400" y="100" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Autonomous Agentic AI Pipeline</text>
</svg>
