<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" width="100%" height="100%">
  <rect width="1000" height="500" rx="24" fill="#0A1220" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Stylized World Map Grid Dot Pattern -->
  <g fill="#1E293B" opacity="0.6">
    <circle cx="200" cy="180" r="4"/><circle cx="230" cy="190" r="4"/><circle cx="250" cy="160" r="4"/>
    <circle cx="220" cy="220" r="4"/><circle cx="270" cy="240" r="4"/><circle cx="290" cy="210" r="4"/>
    <!-- Europe -->
    <circle cx="480" cy="150" r="4"/><circle cx="510" cy="160" r="4"/><circle cx="530" cy="180" r="4"/>
    <circle cx="500" cy="200" r="4"/>
    <!-- Asia/India -->
    <circle cx="680" cy="220" r="4"/><circle cx="710" cy="230" r="4"/><circle cx="730" cy="250" r="4"/>
    <circle cx="760" cy="210" r="4"/><circle cx="790" cy="260" r="4"/>
    <!-- Americas -->
    <circle cx="280" cy="300" r="4"/><circle cx="310" cy="340" r="4"/><circle cx="330" cy="380" r="4"/>
  </g>

  <!-- Glowing Delivery Nodes -->
  <!-- Pune, India Hub -->
  <g transform="translate(710, 230)">
    <circle cx="0" cy="0" r="16" fill="#2563EB" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#2563EB"/>
    <text x="0" y="-22" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">Pune HQ (Global HQ)</text>
  </g>

  <!-- US Hub -->
  <g transform="translate(250, 180)">
    <circle cx="0" cy="0" r="12" fill="#06B6D4" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#06B6D4"/>
    <text x="0" y="-18" text-anchor="middle" fill="#06B6D4" font-family="sans-serif" font-size="10" font-weight="bold">North America Hub</text>
  </g>

  <!-- Europe Hub -->
  <g transform="translate(500, 160)">
    <circle cx="0" cy="0" r="12" fill="#10B981" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#10B981"/>
    <text x="0" y="-18" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">EMEA Hub</text>
  </g>

  <!-- Singapore Hub -->
  <g transform="translate(780, 280)">
    <circle cx="0" cy="0" r="10" fill="#8B5CF6" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="5" fill="#8B5CF6"/>
    <text x="0" y="20" text-anchor="middle" fill="#8B5CF6" font-family="sans-serif" font-size="10" font-weight="bold">APAC Hub</text>
  </g>

  <!-- Connective Arc Arcs -->
  <path d="M250 180 Q 375 100 500 160" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M500 160 Q 605 130 710 230" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M710 230 Q 745 255 780 280" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
</svg>
