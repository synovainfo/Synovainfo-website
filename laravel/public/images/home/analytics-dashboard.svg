<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <rect width="800" height="500" rx="24" fill="#080E18" stroke="#1E293B" stroke-width="2"/>
  <!-- Telemetry Bar Charts -->
  <g transform="translate(60, 380)">
    <rect x="0" y="-120" width="30" height="120" rx="6" fill="#2563EB"/>
    <rect x="50" y="-180" width="30" height="180" rx="6" fill="#06B6D4"/>
    <rect x="100" y="-150" width="30" height="150" rx="6" fill="#2563EB"/>
    <rect x="150" y="-240" width="30" height="240" rx="6" fill="#10B981"/>
    <rect x="200" y="-210" width="30" height="210" rx="6" fill="#3B82F6"/>
    <rect x="250" y="-270" width="30" height="270" rx="6" fill="#8B5CF6"/>
  </g>

  <!-- Throughput Curve Line -->
  <path d="M60 260 Q 110 200 160 230 T 260 140 T 360 110" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

  <!-- Metric Gauges right panel -->
  <g transform="translate(420, 100)">
    <rect width="320" height="300" rx="20" fill="#0F1B2D" stroke="#1E293B" stroke-width="2"/>
    <text x="30" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">System Live Performance</text>

    <!-- Gauge 1 -->
    <text x="30" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11">ANYCAST EDGE LATENCY</text>
    <text x="30" y="120" fill="#10B981" font-family="sans-serif" font-size="24" font-weight="bold">4.2 ms</text>

    <!-- Gauge 2 -->
    <text x="30" y="170" fill="#94A3B8" font-family="sans-serif" font-size="11">THROUGHPUT RATE</text>
    <text x="30" y="200" fill="#06B6D4" font-family="sans-serif" font-size="24" font-weight="bold">1.4M req/sec</text>

    <!-- Gauge 3 -->
    <text x="30" y="250" fill="#94A3B8" font-family="sans-serif" font-size="11">AVAILABILITY SLA</text>
    <text x="30" y="280" fill="#3B82F6" font-family="sans-serif" font-size="24" font-weight="bold">99.999%</text>
  </g>

  <text x="60" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">Real-Time Enterprise Telemetry</text>
</svg>
