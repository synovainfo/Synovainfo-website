<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03071e" />
      <stop offset="50%" stop-color="#0f0e17" />
      <stop offset="100%" stop-color="#1a002c" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7209b7" />
      <stop offset="50%" stop-color="#3a0ca3" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-cyber)" />
  
  <!-- Cyber Hexagonal Mesh Grid -->
  <g stroke="#7209b7" stroke-opacity="0.15" stroke-width="1.5">
    <polygon points="100,50 140,50 160,85 140,120 100,120 80,85" fill="none" />
    <polygon points="170,50 210,50 230,85 210,120 170,120 150,85" fill="none" />
    <polygon points="240,50 280,50 300,85 280,120 240,120 220,85" fill="none" />
    <polygon points="135,125 175,125 195,160 175,195 135,195 115,160" fill="none" />
    <polygon points="205,125 245,125 265,160 245,195 205,195 185,160" fill="none" />
    <polygon points="535,125 575,125 595,160 575,195 535,195 515,160" fill="none" />
    <polygon points="605,125 645,125 665,160 645,195 605,195 585,160" fill="none" />
  </g>

  <!-- Central Shield -->
  <path d="M400 90 L520 150 V280 C520 360 400 420 400 420 C400 420 280 360 280 280 V150 L400 90 Z" fill="url(#shield-grad)" fill-opacity="0.3" stroke="#4cc9f0" stroke-width="3" />
  <path d="M400 120 L490 165 V260 C490 330 400 380 400 380 C400 380 310 330 310 260 V165 L400 120 Z" stroke="#f72585" stroke-width="1.5" stroke-dasharray="8 4" fill="none" />

  <!-- Shield Core Lock Icon -->
  <rect x="375" y="220" width="50" height="40" rx="8" fill="#4cc9f0" />
  <path d="M385 220 V200 C385 190 415 190 415 200 V220" stroke="#4cc9f0" stroke-width="4" fill="none" />
  <circle cx="400" cy="240" r="5" fill="#03071e" />

  <!-- Labels -->
  <text x="400" y="320" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">ZERO TRUST SECURITY MESH</text>
  <text x="400" y="342" fill="#4cc9f0" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle">AES-256 Quantum-Safe Encryption &amp; Real-time HSM Vault</text>

  <!-- Node Pulsing Nodes -->
  <circle cx="150" cy="85" r="6" fill="#f72585" />
  <circle cx="645" cy="160" r="6" fill="#4cc9f0" />
  <line x1="150" y1="85" x2="280" y2="180" stroke="#f72585" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="645" y1="160" x2="520" y2="200" stroke="#4cc9f0" stroke-width="1.5" stroke-dasharray="4 4" />
</svg>
