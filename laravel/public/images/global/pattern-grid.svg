<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5"/></pattern></defs><rect width="400" height="400" fill="url(#g1)"/><rect width="400" height="400" fill="url(#grid)" opacity="0.5"/>
