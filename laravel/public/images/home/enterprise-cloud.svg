<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <rect width="800" height="500" rx="24" fill="#0A1220" stroke="#1E293B" stroke-width="2"/>
  <!-- Multi Cloud Nodes -->
  <g transform="translate(100, 150)">
    <rect width="180" height="200" rx="20" fill="#0F1B2D" stroke="#2563EB" stroke-width="2"/>
    <text x="90" y="40" text-anchor="middle" fill="#2563EB" font-family="sans-serif" font-size="14" font-weight="bold">AWS Cloud</text>
    <rect x="25" y="70" width="130" height="35" rx="8" fill="#2563EB" fill-opacity="0.15"/>
    <text x="90" y="92" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11">EKS Clusters</text>
    <rect x="25" y="120" width="130" height="35" rx="8" fill="#2563EB" fill-opacity="0.15"/>
    <text x="90" y="142" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11">Aurora Serverless</text>
  </g>

  <g transform="translate(310, 150)">
    <rect width="180" height="200" rx="20" fill="#0F1B2D" stroke="#06B6D4" stroke-width="2"/>
    <text x="90" y="40" text-anchor="middle" fill="#06B6D4" font-family="sans-serif" font-size="14" font-weight="bold">Azure Hybrid</text>
    <rect x="25" y="70" width="130" height="35" rx="8" fill="#06B6D4" fill-opacity="0.15"/>
    <text x="90" y="92" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11">AKS Fabric</text>
    <rect x="25" y="120" width="130" height="35" rx="8" fill="#06B6D4" fill-opacity="0.15"/>
    <text x="90" y="142" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11">Cosmos DB</text>
  </g>

  <g transform="translate(520, 150)">
    <rect width="180" height="200" rx="20" fill="#0F1B2D" stroke="#10B981" stroke-width="2"/>
    <text x="90" y="40" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="bold">GCP Edge</text>
    <rect x="25" y="70" width="130" height="35" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <text x="90" y="92" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11">GKE Engine</text>
    <rect x="25" y="120" width="130" height="35" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <text x="90" y="142" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11">BigQuery Pipeline</text>
  </g>

  <!-- Anycast WAN Mesh Line -->
  <path d="M190 380h420" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="400" y="415" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold">Unified Cross-Cloud Anycast Mesh</text>
</svg>
