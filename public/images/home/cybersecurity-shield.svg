<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <rect width="800" height="500" rx="24" fill="#0A1220" stroke="#1E293B" stroke-width="2"/>
  <!-- Shield Symbol -->
  <g transform="translate(400, 230)">
    <path d="M0 -100 L90 -40 V50 C90 120 0 160 0 160 C0 160 -90 120 -90 50 V-40 Z" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="4"/>
    <circle cx="0" cy="20" r="30" fill="#10B981" fill-opacity="0.2"/>
    <path d="M-12 20 L-4 28 L14 10" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Surrounding Badges -->
  <g transform="translate(140, 210)">
    <rect width="140" height="60" rx="12" fill="#0F1B2D" stroke="#2563EB" stroke-width="2"/>
    <text x="70" y="35" text-anchor="middle" fill="#2563EB" font-family="sans-serif" font-size="12" font-weight="bold">ISO 27001</text>
  </g>

  <g transform="translate(520, 210)">
    <rect width="140" height="60" rx="12" fill="#0F1B2D" stroke="#06B6D4" stroke-width="2"/>
    <text x="70" y="35" text-anchor="middle" fill="#06B6D4" font-family="sans-serif" font-size="12" font-weight="bold">SOC 2 Type II</text>
  </g>

  <line x1="280" y1="240" x2="310" y2="240" stroke="#2563EB" stroke-width="2"/>
  <line x1="490" y1="240" x2="520" y2="240" stroke="#06B6D4" stroke-width="2"/>

  <text x="400" y="70" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">Zero-Trust Enterprise Security Governance</text>
</svg>
