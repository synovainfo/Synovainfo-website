<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" width="100%" height="100%">
  <rect width="800" height="500" rx="24" fill="#080E18" stroke="#1E293B" stroke-width="2"/>
  <!-- Central Mesh Ring -->
  <circle cx="400" cy="250" r="140" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="400" cy="250" r="180" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Core Cluster -->
  <circle cx="400" cy="250" r="45" fill="#2563EB" fill-opacity="0.15" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="254" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">K8s Mesh</text>

  <!-- Surrounding Service Nodes -->
  <!-- Service 1: Auth -->
  <g transform="translate(260, 150)">
    <circle cx="20" cy="20" r="28" fill="#0F1B2D" stroke="#06B6D4" stroke-width="2"/>
    <text x="20" y="24" text-anchor="middle" fill="#06B6D4" font-family="sans-serif" font-size="10" font-weight="bold">Auth</text>
  </g>
  <!-- Service 2: Billing -->
  <g transform="translate(500, 150)">
    <circle cx="20" cy="20" r="28" fill="#0F1B2D" stroke="#10B981" stroke-width="2"/>
    <text x="20" y="24" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">Billing</text>
  </g>
  <!-- Service 3: AI Inference -->
  <g transform="translate(520, 310)">
    <circle cx="20" cy="20" r="28" fill="#0F1B2D" stroke="#8B5CF6" stroke-width="2"/>
    <text x="20" y="24" text-anchor="middle" fill="#8B5CF6" font-family="sans-serif" font-size="10" font-weight="bold">vLLM</text>
  </g>
  <!-- Service 4: Telemetry -->
  <g transform="translate(240, 310)">
    <circle cx="20" cy="20" r="28" fill="#0F1B2D" stroke="#F59E0B" stroke-width="2"/>
    <text x="20" y="24" text-anchor="middle" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="bold">Metrics</text>
  </g>

  <!-- Connecting Rays -->
  <line x1="280" y1="170" x2="360" y2="220" stroke="#06B6D4" stroke-width="2"/>
  <line x1="500" y1="170" x2="440" y2="220" stroke="#10B981" stroke-width="2"/>
  <line x1="520" y1="310" x2="440" y2="280" stroke="#8B5CF6" stroke-width="2"/>
  <line x1="260" y1="310" x2="360" y2="280" stroke="#F59E0B" stroke-width="2"/>

  <!-- Legend -->
  <text x="40" y="450" fill="#94A3B8" font-family="sans-serif" font-size="11">Zero-Trust mTLS Encryption Across Microservices</text>
</svg>
